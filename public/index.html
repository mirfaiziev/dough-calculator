<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dough calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <main>
        <div class="py-5 text center">
            <h1>Dough calculator</h1>

            <div class="row g-5">
                <div class="col-sm-3">
                    <form novalidate>
                        <div class="mb-3">
                            <label for="dough-hydration" class="form-label">Dough hydration</label>
                            <input type="text" class="form-control" id="dough-hydration"/>
                        </div>
                        <div class="mb-3">
                            <label for="flour-weight" class="form-label">Flour weight</label>
                            <input type="text" class="form-control" id="flour-weight"/>
                        </div>
                        <div class="mb-3">
                            <label for="water-weight" class="form-label">Water weight</label>
                            <input type="text" class="form-control" id="water-weight"/>
                        </div>
                        <div class="mb-3">
                            <label for="dough-weight" class="form-label">Dough weight</label>
                            <input type="text" class="form-control" id="dough-weight"/>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
        crossorigin="anonymous"></script>
<script>

    updateValues = function (hydration, flour, water) {
        const doughHydrationEl = document.getElementById('dough-hydration')
        const flourWeighEl = document.getElementById('flour-weight')
        const waterWeighEl = document.getElementById('water-weight')
        const doughTotalEl = document.getElementById('dough-weight')

        doughHydrationEl.value = hydration
        flourWeighEl.value = flour
        waterWeighEl.value = water
        doughTotalEl.value = flour+water
    }

    setDefaultValues = function() {
        updateValues(60, 300, 500)
    }

    document.addEventListener("DOMContentLoaded", function () {
        setDefaultValues()
    });
</script>
</body>
</html>
